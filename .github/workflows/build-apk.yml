name: Anivio release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or full commit SHA to build'
        required: true
        default: 'main'
      bump:
        description: 'Version increment (beta builds continue the current beta version)'
        type: choice
        options: [patch, minor, major]
        default: patch
      release_mode:
        description: 'Publish now, create a draft, or save artifacts only'
        type: choice
        options: [draft, publish, artifact]
        default: draft
      arch:
        description: 'CPU architecture for native libraries'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - all
      build_type:
        description: 'Build type (debug requires artifact mode)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      prerelease:
        description: 'Create a beta version and exclude it from the stable update channel'
        required: true
        default: true
        type: boolean
      include_windows:
        description: 'Build Windows x64 and attach it to the same release'
        type: boolean
        default: true

# All version allocation and publication happens under one repository-wide lock.
concurrency:
  group: android-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: write # Version allocation must see existing drafts.
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      commit: ${{ steps.version.outputs.commit }}
      windows_commit: ${{ steps.version.outputs.windows_commit }}
    steps:
      - name: Validate build and publication mode
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          if [[ "$BUILD_TYPE" == debug && "$RELEASE_MODE" != artifact ]]; then
            echo "Debug builds use a separate application ID. Select artifact mode to build one." >&2
            exit 1
          fi

      - name: Check out ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Allocate version and generate changelog
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_BUMP: ${{ inputs.bump }}
          IS_PRERELEASE: ${{ inputs.prerelease || inputs.build_type == 'debug' }}
          INCLUDE_WINDOWS: ${{ inputs.include_windows && inputs.build_type == 'release' }}
        run: |
          mkdir -p build/release
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --slurp | jq 'add // []' > build/release/releases.json
          python scripts/prepare-android-release.py \
            --releases build/release/releases.json --bump "${VERSION_BUMP}" \
            --prerelease "${IS_PRERELEASE}" --repository "${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          cat build/release/notes.md >> "$GITHUB_STEP_SUMMARY"
          if [[ "$INCLUDE_WINDOWS" == true ]]; then
            windows_commit="$(git rev-parse refs/remotes/origin/windows^{commit})"
            echo "windows_commit=$windows_commit" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle caching
        # Caches Gradle dependencies + build outputs between runs so CI builds
        # stop starting from zero every time (the main reason CI was ~35 min
        # vs ~4 min on a warm laptop).
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the action's stale default ("tools platform-tools"):
          # the legacy "tools" package no longer exists and makes sdkmanager fail.
          packages: platform-tools build-tools;37.0.0

      - name: Install android-37 platform (missing from sdkmanager repo index)
        run: |
          curl -sSL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r01.zip
          unzip -q -o /tmp/platform-37.zip -d "$ANDROID_SDK_ROOT/platforms"
          # zip's top-level dir is android-37.0; Gradle expects android-37
          mv "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
          test -f "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"

      - name: Configure runtime and release signing
        env:
          ANIVIO_SUPABASE_URL: ${{ secrets.ANIVIO_SUPABASE_URL }}
          ANIVIO_SUPABASE_ANON_KEY: ${{ secrets.ANIVIO_SUPABASE_ANON_KEY }}
          ANIVIO_SUPABASE_FALLBACK_URL: ${{ secrets.ANIVIO_SUPABASE_FALLBACK_URL }}
          ANIVIO_DEVICE_LINK_URL: ${{ vars.ANIVIO_DEVICE_LINK_URL }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_REDIRECT_URI: ${{ secrets.MAL_REDIRECT_URI }}
          ANIVIO_UPDATE_GITHUB_TOKEN: ${{ secrets.UPDATER_GITHUB_TOKEN }}
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          ANILIST_REDIRECT_URI: ${{ secrets.ANILIST_REDIRECT_URI }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI: ${{ secrets.TRAKT_REDIRECT_URI }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_REDIRECT_URI: ${{ secrets.SIMKL_REDIRECT_URI }}
          SIMKL_APP_NAME: ${{ secrets.SIMKL_APP_NAME }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          CONTRIBUTIONS_URL: ${{ secrets.CONTRIBUTIONS_URL }}
          SUPPORTERS_WALL_URL: ${{ secrets.SUPPORTERS_WALL_URL }}
          DONATIONS_BASE_URL: ${{ secrets.DONATIONS_BASE_URL }}
          DONATIONS_DONATE_URL: ${{ secrets.DONATIONS_DONATE_URL }}
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          NUVIO_RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          BUILD_TYPE: ${{ inputs.build_type }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          keys = ['ANIVIO_SUPABASE_URL', 'ANIVIO_SUPABASE_ANON_KEY', 'ANIVIO_SUPABASE_FALLBACK_URL', 'NUVIO_SUPABASE_URL', 'NUVIO_SUPABASE_ANON_KEY', 'NUVIO_SUPABASE_FALLBACK_URL', 'SENTRY_DSN', 'FANART_API_KEY', 'TVDB_API_KEY', 'DISCORD_APP_ID', 'MAL_CLIENT_ID', 'MAL_REDIRECT_URI', 'ANIVIO_UPDATE_GITHUB_TOKEN', 'ANILIST_CLIENT_ID', 'ANILIST_REDIRECT_URI', 'TRAKT_CLIENT_ID', 'TRAKT_CLIENT_SECRET', 'TRAKT_REDIRECT_URI', 'SIMKL_CLIENT_ID', 'SIMKL_REDIRECT_URI', 'SIMKL_APP_NAME', 'PREMIUMIZE_CLIENT_ID', 'INTRODB_API_URL', 'IMDB_RATINGS_API_BASE_URL', 'IMDB_TAPFRAME_API_BASE_URL', 'CONTRIBUTIONS_URL', 'SUPPORTERS_WALL_URL', 'DONATIONS_BASE_URL', 'DONATIONS_DONATE_URL']
          props = {name: os.environ.get(name, '') for name in keys}
          props['ANIVIO_DEVICE_LINK_URL'] = os.environ.get('ANIVIO_DEVICE_LINK_URL', '')
          props.update(ANIVIO_UPDATE_GITHUB_OWNER='mdtahseen7', ANIVIO_UPDATE_GITHUB_REPO='Anivio', ANIVIO_RELEASE_TAG=os.environ['RELEASE_TAG'])
          signing = ['NUVIO_RELEASE_KEYSTORE_BASE64','NUVIO_RELEASE_STORE_PASSWORD','NUVIO_RELEASE_KEY_ALIAS','NUVIO_RELEASE_KEY_PASSWORD']
          complete = all(os.environ.get(k) for k in signing)
          if os.environ['BUILD_TYPE'] == 'release' and os.environ['RELEASE_MODE'] != 'artifact' and not complete:
              raise SystemExit('Signed releases require all NUVIO_RELEASE_* secrets. Use artifact mode for a test build.')
          if complete:
              keystore = Path(os.environ['RUNNER_TEMP']) / 'anivio-release.jks'
              keystore.write_bytes(base64.b64decode(os.environ[signing[0]], validate=True))
              props['NUVIO_RELEASE_STORE_FILE'] = str(keystore)
              props.update({k: os.environ[k] for k in signing[1:]})
          Path('local.properties').write_text(''.join(k+'='+escape(v)+'\n' for k,v in props.items()))
          PY

      - name: Build APK (${{ inputs.arch }}, ${{ inputs.build_type }})
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          BUILD_ARCH: ${{ inputs.arch }}
        run: |
          TYPE="${BUILD_TYPE}"
          TASK="assembleFull$(tr '[:lower:]' '[:upper:]' <<< "${TYPE:0:1}")${TYPE:1}"
          ./gradlew ":androidApp:$TASK" "-PanivioAbi=${BUILD_ARCH}" -PanivioCiBuild=true \
            "-PanivioVersionName=${{ steps.version.outputs.version }}" \
            "-PanivioVersionCode=${{ steps.version.outputs.version_code }}" --console=plain

      - name: Prepare named release assets
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ARCH: ${{ inputs.arch }}
        run: |
          APK_DIR="androidApp/build/outputs/apk/full/${BUILD_TYPE}"
          mkdir -p build/release/assets
          count=0
          for apk in "$APK_DIR"/*.apk; do
            test -f "$apk"
            count=$((count + 1))
            cp "$apk" "build/release/assets/Anivio-${RELEASE_VERSION}-${RELEASE_ARCH}-${BUILD_TYPE}-${count}.apk"
          done
          cp build/release/release.json build/release/assets/release.json
          (cd build/release/assets && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload APK, metadata, checksums, and changelog
        uses: actions/upload-artifact@v4
        with:
          name: Anivio-${{ steps.version.outputs.version }}-${{ inputs.arch }}
          path: |
            build/release/assets/*
            build/release/notes.md
          if-no-files-found: error

  windows:
    name: Build Windows
    if: inputs.include_windows && inputs.build_type == 'release'
    needs: build
    uses: ./.github/workflows/windows-package.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.build.outputs.windows_commit }}
      version: ${{ needs.build.outputs.version }}
      version_code: ${{ needs.build.outputs.version_code }}

  release:
    name: Create the GitHub release
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') && inputs.release_mode != 'artifact' }}
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android packages and changelog
        uses: actions/download-artifact@v8
        with:
          name: Anivio-${{ needs.build.outputs.version }}-${{ inputs.arch }}
          path: android-release
      - name: Download the Windows installer
        if: needs.windows.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: Anivio-Windows-x64
          path: windows-release
      - name: Verify assets and create one release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          WINDOWS_COMMIT: ${{ needs.build.outputs.windows_commit }}
          INCLUDE_WINDOWS: ${{ needs.windows.result == 'success' }}
        run: |
          if [[ "$INCLUDE_WINDOWS" == true ]]; then
            cp windows-release/Anivio-Windows-x64.exe android-release/assets/
            tr -d '\r' < windows-release/SHA256SUMS.txt >> android-release/assets/SHA256SUMS.txt
            jq --arg windows_commit "$WINDOWS_COMMIT" '. + {windows_commit: $windows_commit}' \
              android-release/assets/release.json > release.json
            mv release.json android-release/assets/release.json
            {
              printf '\n### Windows\n\n'
              printf 'Download **Anivio-Windows-x64.exe** to install or upgrade Anivio for Windows.\n\n'
              printf '[Windows source](https://github.com/%s/commit/%s)\n' "$GITHUB_REPOSITORY" "$WINDOWS_COMMIT"
            } >> android-release/notes.md
          fi
          (cd android-release/assets && sha256sum --check SHA256SUMS.txt)
          args=("$RELEASE_TAG" --target "$RELEASE_COMMIT" --title "Anivio $RELEASE_VERSION" --notes-file android-release/notes.md)
          if [[ "$RELEASE_MODE" == draft ]]; then args+=(--draft); fi
          if [[ "$IS_PRERELEASE" == true ]]; then args+=(--prerelease --latest=false); else args+=(--latest); fi
          gh release create --repo "$GITHUB_REPOSITORY" "${args[@]}" android-release/assets/*
