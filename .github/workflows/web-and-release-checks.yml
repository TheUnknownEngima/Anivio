name: Website and release checks
on:
  pull_request:
    paths: ['website/**', 'supabase/**', 'scripts/*release*', 'scripts/generate-web-settings.py', '.github/workflows/build-apk.yml', '.github/workflows/android-release.yml', '.github/workflows/web-and-release-checks.yml', 'composeApp/src/androidMain/**/PlayerSettingsStorage.android.kt']
  push:
    branches: [cmp-rewrite]
    paths: ['website/**', 'supabase/**', 'scripts/*release*', 'scripts/generate-web-settings.py', '.github/workflows/build-apk.yml', '.github/workflows/android-release.yml', '.github/workflows/web-and-release-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix website
      - run: python scripts/test_prepare_android_release.py
      - run: node scripts/test-workflow-scripts.mjs
      - run: python scripts/generate-web-settings.py
      - run: git diff --exit-code -- website/src/generated-settings.json
      - run: npm test --prefix website
      - run: npm run build --prefix website
